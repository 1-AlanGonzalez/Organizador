# Base temporal y aislada: nunca utiliza DB_URL ni la base local del desarrollador.
spring.datasource.url=jdbc:h2:mem:gym_manager_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Valor exclusivo para el usuario administrador temporal de la prueba.
app.admin.password=test-admin-only
app.security.maximum-sessions=1

spring.thymeleaf.cache=false
