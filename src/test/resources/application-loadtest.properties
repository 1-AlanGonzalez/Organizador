# Esta configuración solo se activa mediante @ActiveProfiles("loadtest").
# No tiene una URL por defecto: si LOADTEST_DB_URL no existe, Spring no inicia.
spring.datasource.url=${LOADTEST_DB_URL}
spring.datasource.username=${LOADTEST_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${LOADTEST_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Crea las tablas si la base está vacía y conserva los datos al finalizar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Cantidades configurables mediante variables de entorno.
loadtest.gyms=${LOADTEST_GYMS:2}
loadtest.clients-per-gym=${LOADTEST_CLIENTS_PER_GYM:1000}
loadtest.activities-per-gym=${LOADTEST_ACTIVITIES_PER_GYM:10}
loadtest.instructors-per-gym=${LOADTEST_INSTRUCTORS_PER_GYM:15}
loadtest.history-months=${LOADTEST_HISTORY_MONTHS:6}

# SetupLoader exige esta propiedad al crear el contexto de Spring.
app.admin.password=loadtest-admin-only
