spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/GymOrganization}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# La sesion expira a los 30 minutos de inactividad
server.servlet.session.timeout=30m
# NO poner la contraseña real acá en producción
app.admin.password=${APP_ADMIN_PASSWORD}
app.security.maximum-sessions=${APP_MAXIMUM_SESSIONS:1}

spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
