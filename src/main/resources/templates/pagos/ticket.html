<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .acciones {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 420px;
        }
        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .btn-print  { background: #1a1a2e; color: #fff; }
        .btn-volver { background: #fff; color: #555; border: 1px solid #ddd; }
        .btn-print:hover  { background: #16213e; }
        .btn-volver:hover { background: #f8f8f8; }
        .ticket {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            position: relative;
        }
        .ticket::before, .ticket::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            height: 12px;
            background: radial-gradient(circle at 10px 6px, #f0f2f5 6px, transparent 0),
                        radial-gradient(circle at 30px 6px, #f0f2f5 6px, transparent 0);
            background-size: 20px 12px;
        }
        .ticket::before { top: -1px; }
        .ticket::after  { bottom: -1px; transform: rotate(180deg); }
        .gym-nombre {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #1a1a2e;
            margin-bottom: 0.25rem;
        }
        .gym-subtitulo {
            text-align: center;
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 1.5rem;
        }
        .divider {
            border: none;
            border-top: 1px dashed #e0e0e0;
            margin: 1rem 0;
        }
        .badge-pagado {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .cliente-nombre {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a2e;
        }
        .cliente-dni {
            font-size: 0.8rem;
            color: #999;
            margin-top: 0.1rem;
        }
        .detalle-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.4rem 0;
            font-size: 0.875rem;
        }
        .detalle-fila .label { color: #888; }
        .detalle-fila .valor { font-weight: 500; color: #333; }
        .total-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            border-top: 2px solid #1a1a2e;
        }
        .total-fila .total-label { font-size: 0.875rem; font-weight: 700; text-transform: uppercase; color: #1a1a2e; }
        .total-fila .total-valor { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; }
        .mensaje-pie {
            text-align: center;
            font-size: 0.78rem;
            color: #bbb;
            font-style: italic;
            margin-top: 1.25rem;
        }
        .numero-comprobante {
            text-align: center;
            font-size: 0.7rem;
            color: #ccc;
            margin-top: 0.5rem;
            font-family: monospace;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .acciones { display: none; }
            .ticket { box-shadow: none; border-radius: 0; max-width: 100%; padding: 1rem; }
            .ticket::before, .ticket::after { display: none; }
        }
    </style>
</head>
<body>

    <div class="acciones">
        <a th:href="@{/ingresos}" class="btn btn-volver">← Volver</a>
        <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    </div>

    <div class="ticket">

        <!-- Nombre del gimnasio — null safe -->
        <div class="gym-nombre"
             th:text="${usuario?.nombreGimnasio != null and !#strings.isEmpty(usuario.nombreGimnasio)} ? ${usuario.nombreGimnasio} : 'GYM MANAGER'">
            GYM MANAGER
        </div>
        <div class="gym-subtitulo">Comprobante de Pago</div>

        <hr class="divider">

        <span class="badge-pagado">✓ Pago registrado</span>

        <!-- Cliente — null safe con ?: -->
        <div class="cliente-nombre"
             th:text="${pago?.actividadCliente?.cliente?.nombre} + ' ' + ${pago?.actividadCliente?.cliente?.apellido}">
            —
        </div>
        <div class="cliente-dni"
             th:text="'DNI: ' + (${pago?.actividadCliente?.cliente?.dni} ?: '—')">
            DNI: —
        </div>

        <hr class="divider">

        <!-- Detalle -->
        <div class="detalle-fila">
            <span class="label">Actividad</span>
            <span class="valor" th:text="${pago?.actividadCliente?.actividad?.nombre} ?: '—'">—</span>
        </div>
        <div class="detalle-fila">
            <span class="label">Plan</span>
            <span class="valor" th:text="${pago?.actividadCliente?.tipoDeCobro} ?: '—'">—</span>
        </div>
        <div class="detalle-fila">
            <span class="label">Método de pago</span>
            <span class="valor" th:text="${pago?.metodoPago?.nombre} ?: '—'">—</span>
        </div>

        <!-- Fecha — null safe: solo formatea si no es null -->
        <div class="detalle-fila">
            <span class="label">Fecha</span>
            <span class="valor"
                  th:text="${pago?.fechaGeneracion != null} ? ${#temporals.format(pago.fechaGeneracion, 'dd/MM/yyyy HH:mm')} : ${#temporals.format(pago?.fechaGeneracion, 'dd/MM/yyyy')}">
                —
            </span>
        </div>

        <div class="detalle-fila" th:if="${pago?.observaciones != null and !#strings.isEmpty(pago.observaciones)}">
            <span class="label">Observaciones</span>
            <span class="valor" th:text="${pago.observaciones}">—</span>
        </div>

        <!-- Total -->
        <div class="total-fila">
            <span class="total-label">Total abonado</span>
            <span class="total-valor">
                $<span th:text="${pago?.montoAPagar != null} ? ${#numbers.formatDecimal(pago.montoAPagar, 0, 'COMMA', 2, 'POINT')} : '0.00'">0.00</span>
            </span>
        </div>

        <p class="mensaje-pie">¡Gracias por tu pago!</p>
        <p class="numero-comprobante" th:text="'Comprobante #' + (${pago?.idPago} ?: '—')">Comprobante #0</p>

    </div>

</body>
</html>
