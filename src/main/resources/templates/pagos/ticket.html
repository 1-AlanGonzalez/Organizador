<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprobante de Pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            --sidebar-bg: #1f2a30;
            --main-bg: #f8fafc;
            --card-bg: #ffffff;
            --card-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--main-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        /* ── Acciones ── */
        .acciones {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 440px;
        }
        .btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-print  { background: var(--sidebar-bg); color: #fff; }
        .btn-volver { background: var(--card-bg); color: #555; border: 1px solid #e2e8f0; }

        /* ── Ticket ── */
        .ticket {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        /* Franja superior con el color del sidebar */
        .ticket-header {
            background: var(--sidebar-bg);
            padding: 1.75rem 2rem 1.5rem;
            text-align: center;
            color: #fff;
        }
        .ticket-header .gym-nombre {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.95;
        }
        .ticket-header .gym-sub {
            font-size: 0.72rem;
            opacity: 0.55;
            margin-top: 0.2rem;
            letter-spacing: 0.04em;
        }

        /* Badge pagado */
        .badge-pagado {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #d1fae5;
            color: #065f46;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 1rem;
        }

        /* Cuerpo */
        .ticket-body { padding: 1.75rem 2rem; }

        .cliente-nombre {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .cliente-dni {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .divider {
            border: none;
            border-top: 1px dashed #e2e8f0;
            margin: 1.25rem 0;
        }

        .detalle-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.45rem 0;
            font-size: 0.875rem;
        }
        .detalle-fila .label {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .detalle-fila .valor {
            font-weight: 500;
            color: #334155;
        }

        /* Total */
        .total-fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.75rem;
            padding: 1rem 1.25rem;
            background: var(--main-bg);
            border-radius: 10px;
        }
        .total-fila .total-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }
        .total-fila .total-valor {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sidebar-bg);
        }

        .pie {
            text-align: center;
            padding: 1rem 2rem 1.5rem;
            border-top: 1px solid #f1f5f9;
        }
        .pie .mensaje {
            font-size: 0.78rem;
            color: #94a3b8;
            font-style: italic;
        }
        .pie .comprobante-num {
            font-size: 0.68rem;
            color: #cbd5e1;
            margin-top: 0.35rem;
            font-family: monospace;
            letter-spacing: 0.05em;
        }

        @media print {
            body { background: #fff; padding: 0; }
            .acciones { display: none; }
            .ticket { box-shadow: none; border-radius: 0; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="acciones">
        <a th:href="@{/ingresos}" class="btn btn-volver">
            <i data-lucide="arrow-left" style="width:15px;height:15px;"></i>
            Volver
        </a>
        <button class="btn btn-print" onclick="window.print()">
            <i data-lucide="printer" style="width:15px;height:15px;"></i>
            Imprimir / PDF
        </button>
    </div>

    <div class="ticket">

        <!-- Franja oscura con nombre del gym -->
        <div class="ticket-header">
            <div class="gym-nombre"
                 th:text="${usuario?.nombreGimnasio != null and !#strings.isEmpty(usuario.nombreGimnasio)}
                           ? ${usuario.nombreGimnasio} : 'GYM MANAGER'">
                GYM MANAGER
            </div>
            <div class="gym-sub">Comprobante de Pago</div>
            <div class="badge-pagado">
                <i data-lucide="check-circle" style="width:12px;height:12px;"></i>
                Pago registrado
            </div>
        </div>

        <!-- Cuerpo -->
        <div class="ticket-body">

            <!-- Cliente -->
            <div class="cliente-nombre"
                 th:text="${pago?.actividadCliente?.cliente?.nombre} + ' ' + ${pago?.actividadCliente?.cliente?.apellido}">
                —
            </div>
            <div class="cliente-dni">
                <i data-lucide="id-card" style="width:12px;height:12px;"></i>
                <span th:text="'DNI: ' + (${pago?.actividadCliente?.cliente?.dni} ?: '—')">DNI: —</span>
            </div>

            <hr class="divider">

            <!-- Detalle -->
            <div class="detalle-fila">
                <span class="label">
                    <i data-lucide="dumbbell" style="width:13px;height:13px;"></i>
                    Actividad
                </span>
                <span class="valor" th:text="${pago?.actividadCliente?.actividad?.nombre} ?: '—'">—</span>
            </div>

            <div class="detalle-fila">
                <span class="label">
                    <i data-lucide="tag" style="width:13px;height:13px;"></i>
                    Plan
                </span>
                <span class="valor" th:text="${pago?.actividadCliente?.tipoDeCobro} ?: '—'">—</span>
            </div>

            <div class="detalle-fila">
                <span class="label">
                    <i data-lucide="credit-card" style="width:13px;height:13px;"></i>
                    Método de pago
                </span>
                <span class="valor" th:text="${pago?.metodoPago?.nombre} ?: '—'">—</span>
            </div>

            <div class="detalle-fila">
                <span class="label">
                    <i data-lucide="calendar" style="width:13px;height:13px;"></i>
                    Fecha
                </span>
                <span class="valor"
                      th:text="${pago?.fechaGeneracion != null}
                                ? ${#temporals.format(pago.fechaGeneracion, 'dd/MM/yyyy')}
                                : '—'">—</span>
            </div>

            <div class="detalle-fila"
                 th:if="${pago?.observaciones != null and !#strings.isEmpty(pago.observaciones)}">
                <span class="label">
                    <i data-lucide="message-square" style="width:13px;height:13px;"></i>
                    Observaciones
                </span>
                <span class="valor" th:text="${pago.observaciones}">—</span>
            </div>

            <!-- Total -->
            <div class="total-fila">
                <span class="total-label">Total abonado</span>
                <span class="total-valor">
                    $<span th:text="${pago?.montoAPagar != null}
                                   ? ${#numbers.formatDecimal(pago.montoAPagar, 0, 'COMMA', 2, 'POINT')}
                                   : '0.00'">0.00</span>
                </span>
            </div>
        </div>

        <!-- Pie -->
        <div class="pie">
            <p class="mensaje">¡Gracias por tu pago!</p>
            <p class="comprobante-num"
               th:text="'Comprobante #' + (${pago?.idPago} ?: '—')">Comprobante #0</p>
        </div>

    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
