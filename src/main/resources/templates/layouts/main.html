<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon"
     type="image/x-icon"
      th:href="@{/images/logo/logo.png}">    

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marko+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--  Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <!-- Tom Select -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <!-- CSS propio -->
    <!-- <link rel="stylesheet" th:href="@{/styles.css}"> -->
    <link rel="stylesheet" th:href="@{/styles.css(v=${#dates.createNow().time})}">
    <!-- 
        Lucide Icons
        Librería de iconos moderna y personalizable, similar a Feather Icons pero con más opciones de personalización.
    -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <title th:text="${title}">Gym Manager</title>
</head>

<body>

<div class="d-flex wrapper">

    <!-- SIDEBAR -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <div th:replace="~{fragments/sidebar :: sidebar-fragment}"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-fill ">

        <!-- HEADER -->
     <header class="header-buttom-main p-3 border-bottom-soft"> 
        <button onclick="toggleSidebar()" class="btn btn-outline-secondary d-md-none" id="btnToggleSidebar">
            <i class="bi bi-list fs-4"></i>
        </button>
    </header> 

        <!-- CONTENIDO DINÁMICO -->
        <div class="contenido p-4">
            <div th:insert="~{${vista} :: ${fragmento}}"></div>
        </div>

    </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/script.js}"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script th:src="@{/js/icons.js}"></script>
<!-- Importo apexcharts -->
 <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script th:src="@{/js/chart.js}"></script>


</body>
</html>
