<div th:fragment="contenido" class="h-100 d-flex flex-column p-2" style="overflow: hidden;">

    <div class="d-flex align-items-center justify-content-between mb-2 flex-shrink-0 animate-fade-up">
        <div>
            <h4 class="fw-bold text-dark mb-0">Inicio</h4> 
            <p class="text-muted small mb-0">Resumen general del gimnasio</p>
        </div>
    </div>

    <div class="row g-2 mb-3 flex-shrink-0 animate-fade-up delay-1">
        
    <div class="col-lg-7">
        <div class="card custom-card bg-gradient-hero border-0 h-100 p-3 position-relative overflow-hidden">
            <div class="position-absolute rounded-circle bg-white" style="width: 120px; height: 120px; top: -40px; right: -20px; opacity: 0.1;"></div>
            <div class="position-absolute rounded-circle bg-white" style="width: 80px; height: 80px; bottom: -20px; left: -20px; opacity: 0.05;"></div>

            <div class="d-flex justify-content-between align-items-start position-relative" style="z-index: 2;">
                <div>
                    <span class="text-white-50 text-uppercase small fw-bold ls-1" style="font-size: 0.7rem;">Ingresos del Mes</span>
                    <h6 class="text-white mt-1 fw-bold fs-5" th:text="${#strings.capitalize(#dates.format(#dates.createNow(), 'MMMM'))}">Mes</h6>
                </div>
                <div class="icon-box-glass" style="width: 42px; height: 42px; font-size: 1.2rem;">
                    <i class="bi bi-wallet2"></i>
                </div>
            </div>
            
            <div class="mt-2 position-relative" style="z-index: 2;">
                <h1 class="text-white fw-bold display-6 mb-0" 
                    th:text="${'$' + #numbers.formatDecimal(ingresosTotales, 1, 'POINT', 2, 'COMMA')}">$0.00</h1>
                
                <div class="d-flex align-items-center gap-2 text-white-50 small mt-1">
                    <i class="bi bi-arrow-up-circle-fill text-white"></i>
                    <span>Acumulado actual</span>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card custom-card border-0 h-100 p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold text-dark mb-0 small text-uppercase">Estado Clientes</h6>
                <span class="badge bg-light text-dark border rounded-pill px-2 py-1" style="font-size: 0.7rem;" th:text="${totalClientes + ' Total'}">0 Total</span>
            </div>

            <div class="row g-2 h-100">
                <div class="col-6">
                    <div class="p-2 border rounded-3 bg-light d-flex flex-column justify-content-center align-items-center gap-1 h-100 text-center">
                        <div class="icon-box-light icon-bg-green rounded-circle" style="width: 36px; height: 36px;">
                            <i class="bi bi-person-check-fill small"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0 text-dark" th:text="${clientesActivos}">0</h5>
                            <small class="text-muted fw-bold text-uppercase" style="font-size: 0.6rem;">Activos</small>
                        </div>
                    </div>
                </div>

                <div class="col-6">
                    <div class="p-2 border rounded-3 bg-light d-flex flex-column justify-content-center align-items-center gap-1 h-100 text-center">
                        <div class="icon-box-light icon-bg-orange rounded-circle" style="width: 36px; height: 36px;">
                            <i class="bi bi-person-exclamation small"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0 text-dark" th:text="${clientesPendientes}">0</h5>
                            <small class="text-muted fw-bold text-uppercase" style="font-size: 0.6rem;">Pendientes</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <div class="row flex-grow-1 pb-2 animate-fade-up delay-2" style="min-height: 0;">
        <div class="col-lg-5 d-flex flex-column ">
            <h6 class="section-subtitle flex-shrink-0">Accesos Directos</h6>
            <div class="row g-3">
                <div class="col-6 h-50">
                    <a th:href="@{/asistencias/tomar}" class="btn-widget text-decoration-none  d-flex flex-column justify-content-center align-items-center text-center p-2">
                        <i class="bi bi-qr-code-scan mb-2 text-primary fs-4"></i>
                        <span class="fw-bold text-dark d-block">Asistencia</span>
                        <small class="text-muted">Tomar asistencia</small>
                    </a>
                </div>
                <div class="col-6 h-50">
                    <a th:href="@{/ingresos/nuevo}" class="btn-widget text-decoration-none  d-flex flex-column justify-content-center align-items-center text-center p-2">
                        <i class="bi bi-cash-coin mb-2 text-success fs-4"></i>
                        <span class="fw-bold text-dark d-block">Cobrar</span>
                        <small class="text-muted">Registrar pago</small>
                    </a>
                </div>
                <div class="col-6 h-50">
                    <a th:href="@{/clientes/nuevo}" class="btn-widget text-decoration-none  d-flex flex-column justify-content-center align-items-center text-center p-2">
                        <i class="bi bi-person-plus mb-2 text-info fs-4"></i>
                        <span class="fw-bold text-dark d-block">Nuevo</span>
                        <small class="text-muted">Alta alumno</small>
                    </a>
                </div>
                <div class="col-6 h-50">
                    <a th:href="@{/reportes}" class="btn-widget text-decoration-none d-flex flex-column justify-content-center align-items-center text-center p-2">
                        <i class="bi bi-file-earmark-spreadsheet mb-2 text-secondary fs-4"></i>
                        <span class="fw-bold text-dark d-block">Reportes</span>
                        <small class="text-muted">Exportar Excel</small>
                    </a>
                </div>
            </div>
        </div>
        

        <div class="col-lg-7 d-flex flex-column h-100 " id="tabla-ingresos">
            <h6 class="section-subtitle flex-shrink-0">Tendencia de Ingresos</h6>
            <div class="card custom-card border-0 h-100 w-100 p-3">
                <div id="chart" class="w-100 h-100"></div>
                
                <script th:inline="javascript">
                    /*<![CDATA[*/
                    window.datosGrafico = /*[[${datosGrafico}]]*/ [];
                    window.categoriasGrafico = /*[[${categoriasGrafico}]]*/ [];
                    /*]]>*/
                </script>
            </div>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
</div>
