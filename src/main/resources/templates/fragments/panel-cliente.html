<div th:fragment="panelCliente">

    <style>
        /* ── Inputs ── */
        .ic { /* input-clean */
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            transition: border-color .2s, box-shadow .2s;
        }
        .ic:focus {
            background: #fff;
            border-color: #1f2a30;
            box-shadow: 0 0 0 3px rgba(31,42,48,.08);
            outline: none;
        }
        /* ── Botón principal ── */
        .btn-dark-brand {
            background: linear-gradient(135deg, #1f2a30, #2d3f46);
            color: #fff; border: none; border-radius: 8px;
            font-weight: 600; transition: all .2s;
        }
        .btn-dark-brand:hover {
            background: linear-gradient(135deg, #162024, #243340);
            color: #fff; transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(31,42,48,.25);
        }
        /* ── Tipo de pase (radio buttons) ── */
        .pase-btn { display: none; }
        .pase-label {
            flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 4px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: .82rem; font-weight: 500; color: #64748b;
            cursor: pointer; transition: all .2s; background: #f8fafc;
            user-select: none;
        }
        .pase-btn:checked + .pase-label {
            background: linear-gradient(135deg, #1f2a30, #2d3f46);
            border-color: #1f2a30; color: #fff;
            box-shadow: 0 3px 10px rgba(31,42,48,.2);
        }
        .pase-label:hover { border-color: #94a3b8; color: #1f2a30; background: #f1f5f9; }
        .pase-btn:checked + .pase-label:hover { color: #fff; }
        /* ── Tabla de actividades ── */
        .act-table thead th {
            background: #f8fafc;
            font-size: .68rem; text-transform: uppercase;
            letter-spacing: .05em; color: #94a3b8; font-weight: 700;
            border-bottom: 1.5px solid #e2e8f0; padding: 10px 8px;
        }
        .act-table tbody tr { transition: background .15s; }
        .act-table tbody tr:hover { background: #f8fafc; }
        .act-table tbody td { padding: 9px 8px; border-bottom: 1px solid #f1f5f9; font-size: .85rem; }
        /* ── Card resumen ── */
        .resumen-card {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px; padding: 1rem;
        }
        .total-display {
            font-size: 1.8rem; font-weight: 800; color: #1f2a30; line-height: 1;
        }
        /* ── Bloque inscripción ── */
        .insc-block {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.2rem;
        }
        .insc-block-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem;
        }
        .badge-reinscripcion {
            background: #fff7ed; color: #d97706;
            border: 1px solid #fde68a;
            border-radius: 999px; font-size: .7rem; font-weight: 700;
            padding: 3px 10px;
        }
        /* ── Monto abonado ── */
        .monto-group .input-group-text {
            background: #dcfce7; color: #16a34a;
            border: 1.5px solid #86efac; border-right: none;
            border-radius: 8px 0 0 8px; font-weight: 700;
        }
        .monto-group .form-control {
            border: 1.5px solid #86efac; border-left: none;
            border-radius: 0 8px 8px 0;
            font-weight: 700; color: #16a34a;
        }
        .monto-group .form-control:focus {
            box-shadow: 0 0 0 3px rgba(134,239,172,.25);
            border-color: #4ade80;
        }
        /* ── Checkbox custom ── */
        .form-check-input:checked {
            background-color: #1f2a30;
            border-color: #1f2a30;
        }
    </style>

    <div class="card custom-card w-100 border-0">
        <div class="card-body p-4">

            <!-- Header -->
            <div class="d-flex align-items-center justify-content-between mb-4 pb-3"
                 style="border-bottom:1.5px solid #f1f5f9;">
                <div class="d-flex align-items-center gap-3">
                    <div class="d-flex align-items-center justify-content-center rounded-3 flex-shrink-0"
                         style="width:42px;height:42px;background:linear-gradient(135deg,#1f2a30,#2d3f46);">
                        <i data-lucide="contact" style="width:18px;height:18px;color:#fff;"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0" style="color:#1f2a30;"
                            th:text="${cliente.idCliente != null} ? 'Gestionar Cliente' : 'Nuevo Cliente'">
                            Nuevo Cliente
                        </h4>
                        <small class="text-muted" th:if="${cliente.idCliente == null}">Alta por primera vez</small>
                        <small class="text-muted" th:if="${cliente.idCliente != null}">Edición y Renovaciones</small>
                    </div>
                </div>
            </div>

            <!-- Error -->
            <div th:if="${error}"
                 class="d-flex align-items-center gap-2 px-3 py-2 rounded-3 small fw-medium mb-3"
                 style="background:#fee2e2;color:#ef4444;">
                <i data-lucide="alert-triangle" style="width:15px;height:15px;flex-shrink:0;"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" id="formCliente">
                <input type="hidden" th:field="*{idCliente}">

                <!-- ── Datos Personales ── -->
                <p class="text-uppercase fw-bold mb-3"
                   style="font-size:.68rem;letter-spacing:.08em;color:#94a3b8;">Datos Personales</p>

                <div class="row mb-4 g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color:#64748b;">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control ic" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color:#64748b;">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control ic" placeholder="Apellido" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color:#64748b;">DNI</label>
                        <input type="text" th:field="*{dni}" class="form-control ic" placeholder="Sin puntos" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color:#64748b;">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control ic" placeholder="Opcional">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold" style="color:#64748b;">Email</label>
                        <input type="email" th:field="*{email}" class="form-control ic" placeholder="Opcional">
                    </div>
                </div>
                <!-- ── Bloque inscripción ── -->
                <div class="insc-block">

                    <!-- Header modo edición -->
                    <div th:if="${cliente.idCliente != null}" class="insc-block-header">
                        <div class="d-flex align-items-center gap-2" style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;">
                            <i data-lucide="refresh-cw" style="width:13px;height:13px;"></i>
                            Renovación / Cambio de Plan
                        </div>
                        <span class="badge-reinscripcion">Modo Re-Inscripción</span>
                    </div>

                    <!-- Header modo nuevo -->
                    <div th:if="${cliente.idCliente == null}"
                         class="d-flex align-items-center gap-2 mb-3"
                         style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;">
                        <i data-lucide="shopping-cart" style="width:13px;height:13px;"></i>
                        Inscripción Inicial
                    </div>

                    <div class="row g-3">
                        <!-- Izquierda: tipo + actividades -->
                        <div class="col-md-8">

                            <!-- Tipo de pase -->
                            <label class="form-label small fw-bold mb-2" style="color:#64748b;">Tipo de Pase</label>
                            <div class="d-flex gap-2 mb-3">
                                <input type="radio" class="pase-btn" name="tipoDeCobro" id="cobroMensual"
                                       value="MENSUAL" checked onchange="actualizarModoPlan()">
                                <label class="pase-label" for="cobroMensual">
                                    <i data-lucide="calendar" style="width:13px;height:13px;"></i> Mensual
                                </label>

                                <input type="radio" class="pase-btn" name="tipoDeCobro" id="cobroDiario"
                                       value="DIARIO" onchange="actualizarModoPlan()">
                                <label class="pase-label" for="cobroDiario">
                                    <i data-lucide="calendar-days" style="width:13px;height:13px;"></i> Pase Diario
                                </label>

                                <input type="radio" class="pase-btn" name="tipoDeCobro" id="cobroLibre"
                                       value="LIBRE" onchange="actualizarModoPlan()">
                                <label class="pase-label" for="cobroLibre">
                                    <i data-lucide="gift" style="width:13px;height:13px;"></i> Promo Libre
                                </label>
                            </div>

                            <!-- Tabla de actividades -->
                            <label class="form-label small fw-bold mb-2" style="color:#64748b;">Seleccionar Actividades</label>
                            <div class="rounded-3 overflow-hidden custom-scrollbar"
                                 style="max-height:300px;overflow-y:auto;border:1.5px solid #e2e8f0;">
                                <table class="table act-table mb-0">
                                    <thead>
                                        <tr>
                                            <th style="width:5%;"></th>
                                            <th style="width:40%;">Actividad</th>
                                            <th style="width:25%;">Precio</th>
                                            <th style="width:30%;">Fecha Inicio</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="act : ${actividades}">
                                            <td>
                                                <input class="form-check-input activity-checkbox"
                                                       type="checkbox" name="idActividades"
                                                       th:value="${act.idActividad}"
                                                       th:id="'act_' + ${act.idActividad}"
                                                       th:attr="data-precio-mensual=${act.precio},
                                                                data-precio-diario=${act.precioDiario != null ? act.precioDiario : 0}"
                                                       th:checked="${cliente.inscripciones.?[estado.name() == 'ACTIVA'].![actividad.idActividad].contains(act.idActividad)}"
                                                       onchange="procesarSeleccion(this)">
                                            </td>
                                            <td>
                                                <label class="fw-medium cursor-pointer w-100"
                                                       style="color:#1f2a30;"
                                                       th:for="'act_' + ${act.idActividad}"
                                                       th:text="${act.nombre}">Nombre Actividad</label>
                                            </td>
                                            <td>
                                                <span class="rounded-pill px-2 py-1 d-inline-flex align-items-center gap-1 price-badge"
                                                      style="background:#f1f5f9;color:#64748b;font-size:.72rem;font-weight:600;"
                                                      th:id="'badge_price_' + ${act.idActividad}">
                                                    <i data-lucide="calendar" style="width:10px;height:10px;"></i>
                                                    $<span th:text="${act.precio}"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <input type="date" class="form-control ic form-control-sm"
                                                    th:name="'fechaInicioMap[' + ${act.idActividad} + ']'"
                                                    th:id="'date_' + ${act.idActividad}"
                                                    th:value="${fechasInscripcion != null ? fechasInscripcion[act.idActividad] : ''}">
                                                    
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Derecha: resumen + pago -->
                        <div class="col-md-4">
                            <div class="resumen-card sticky-top" style="top:1rem;z-index:1;">

                                <!-- Total -->
                                <div class="mb-3 pb-3" style="border-bottom:1px solid #f1f5f9;">
                                    <p class="small fw-bold mb-1" style="color:#64748b;">Total Estimado</p>
                                    <div class="total-display">$<span id="totalEstimadoDisplay">0</span></div>
                                    <input type="hidden" id="totalEstimado" value="0">
                                    <small class="text-muted fst-italic" id="lblPlanSeleccionado">Plan Mensual</small>
                                </div>

                                <!-- Monto a abonar -->
                                <div class="mb-3">
                                    <label class="small fw-bold mb-1" style="color:#64748b;">Monto a Abonar Hoy</label>
                                    <div class="input-group monto-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" name="montoAbonado" id="montoAbonado"
                                               class="form-control" placeholder="0.00">
                                    </div>
                                    <button class="btn btn-sm p-0 mt-1 w-100 text-end d-flex align-items-center justify-content-end gap-1"
                                            style="color:#64748b;font-size:.75rem;background:none;border:none;"
                                            type="button" onclick="pagarTotal()">
                                        <i data-lucide="check-check" style="width:12px;height:12px;"></i>
                                        Copiar Total
                                    </button>
                                </div>

                                <!-- Registrar pago -->
                                <div class="pt-2" style="border-top:1px solid #f1f5f9;">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" id="registrarPagoCheck"
                                               name="registrarPago" onchange="togglePago()">
                                        <label class="form-check-label small fw-bold" style="color:#475569;"
                                               for="registrarPagoCheck">
                                            Registrar pago ahora
                                        </label>
                                    </div>

                                    <div id="bloquePago" class="d-none">
                                        <div class="mb-2">
                                            <label class="form-label small fw-bold mb-1" style="color:#64748b;">Método de Pago</label>
                                            <select name="metodoPagoId" class="form-select form-select-sm ic">
                                                <option th:each="m : ${metodosPago}"
                                                        th:value="${m.idMetodo}"
                                                        th:text="${m.nombre}"></option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="form-label small fw-bold mb-1" style="color:#64748b;">Observación</label>
                                            <textarea name="observacionPago" class="form-control form-control-sm ic"
                                                      rows="2" disabled
                                                      placeholder="Pago parcial, promo..."></textarea>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Observaciones -->
                <div class="mt-3">
                    <label class="form-label small fw-bold" style="color:#64748b;">Observaciones</label>
                    <textarea th:field="*{observaciones}" class="form-control ic" rows="2"
                              placeholder="Notas adicionales sobre el cliente..."></textarea>
                </div>

                <!-- Acciones -->
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3" style="border-top:1.5px solid #f1f5f9;">
                    <a th:href="@{/clientes}"
                       class="btn px-4 py-2"
                       style="background:#f1f5f9;color:#64748b;border:none;border-radius:8px;font-weight:500;">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-dark-brand px-4 py-2 d-flex align-items-center gap-2">
                        <i data-lucide="save" style="width:14px;height:14px;"></i>
                        <span th:text="${cliente.idCliente != null} ? 'Guardar Cambios' : 'Registrar Cliente'">Guardar</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/clientes.js}"></script>
</div>
