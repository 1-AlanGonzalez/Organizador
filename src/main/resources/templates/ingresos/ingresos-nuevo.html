<div th:fragment="contenido" class="nuevo-pago-page">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0">Registrar Pago</h4>
            <p class="text-muted small mb-0">Ingrese los detalles del nuevo ingreso</p>
        </div>
        <a th:href="@{/ingresos}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2">
            <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
            <span>Volver</span>
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">

            <!-- Estado vacío: todos los clientes al día -->
            <div th:if="${#lists.isEmpty(clientes)}"
                 class="card custom-card border-0 text-center p-5">
                <i data-lucide="check-circle" style="width:48px;height:48px;" class="text-success d-block mx-auto mb-3"></i>
                <h5 class="fw-bold text-dark">Todo al día</h5>
                <p class="text-muted small mb-3">No hay clientes con pagos pendientes en este momento.</p>
                <a th:href="@{/ingresos}" class="btn btn-outline-secondary btn-sm">
                    Volver al tablero
                </a>
            </div>

            <div th:if="${!#lists.isEmpty(clientes)}"
                 class="card custom-card border-0"
                 style="background: var(--card-bg); box-shadow: var(--card-shadow);">
                <div class="card-body p-0">
                    <form th:action="@{/ingresos/guardar}" method="post">

                        <!-- BLOQUE 1: Cliente -->
                        <div class="p-4 pb-3">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <i data-lucide="user" style="width:15px;height:15px;" class="icons text-secondary"></i>
                                <span class="fw-bold text-dark small text-uppercase"
                                      style="letter-spacing:0.05em;">Cliente</span>
                            </div>
                            <p class="text-muted small mb-3">
                                Solo se muestran clientes con pagos pendientes.
                            </p>
                            <select class="form-select" id="clienteSelect" required>
                                <option value="" disabled selected>Seleccionar cliente...</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.idCliente}"
                                        th:text="${c.nombre + ' ' + c.apellido}">
                                </option>
                            </select>
                            <div id="deudasContainer" class="mt-3"></div>
                        </div>

                        <hr class="m-0" style="border-color:#f1f5f9;">

                        <!-- BLOQUE 2: Detalle -->
                        <div class="p-4 pb-3">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <i data-lucide="banknote" style="width:15px;height:15px;" class="icons text-secondary"></i>
                                <span class="fw-bold text-dark small text-uppercase"
                                      style="letter-spacing:0.05em;">Detalle del pago</span>
                            </div>
                            <p class="text-muted small mb-3">Elegí el método con el que se abona.</p>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Método de pago</label>
                                    <select class="form-select" id="metodo" name="metodoPagoId" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option th:each="m : ${metodosPago}"
                                                th:value="${m.idMetodo}"
                                                th:text="${m.nombre}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Observaciones (opcional)</label>
                                    <input type="text" class="form-control" name="observaciones" placeholder="Notas...">
                                </div>

                                <!-- Fecha -->
                                <div class="col-12">
                                    <label for="fecha" class="form-label small text-muted fw-bold text-uppercase mb-1"
                                           style="font-size: 0.65rem; letter-spacing: 0.06em;">Fecha de pago</label>
                                    <div class="input-group">
                                        <span class="icons input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-calendar-event"></i>
                                        </span>
                                        <input type="date"
                                               class="form-control border-start-0"
                                               id="fecha"
                                               name="fechaDePago"
                                               th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                               required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="m-0" style="border-color:#f1f5f9;">

                        <!-- Acciones -->
                        <div class="p-4 pt-3 d-flex flex-column gap-2">
                            <button type="submit"
                                    class="btn btn-guardar py-2 d-flex align-items-center justify-content-center gap-2">
                                <i data-lucide="check" style="width:16px;height:16px;"></i>
                                Confirmar Pago
                            </button>
                            <a th:href="@{/ingresos}"
                               class="btn btn-cancelar btn-sm text-center">
                                Cancelar operación
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script th:src="@{/js/pagos.js}"></script>
</div>
