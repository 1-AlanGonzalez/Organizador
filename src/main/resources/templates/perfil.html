<div th:fragment="contenido" class="h-100 d-flex flex-column ps-2 pe-2 pb-2">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0">Mi Perfil</h4>
            <p class="text-muted small mb-0">Administrá los datos de tu cuenta</p>
        </div>
        <div class="d-flex gap-2">
            <div th:if="${success}" class="alert alert-success py-2 px-3 shadow-sm mb-0 rounded-3 border-0 small d-flex align-items-center">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger py-2 px-3 shadow-sm mb-0 rounded-3 border-0 small d-flex align-items-center">
                <i class="bi bi-x-circle me-2"></i><span th:text="${error}"></span>
            </div>
        </div>
    </div>

    <div class="row g-3 animate-fade-up">

        <!-- ── Datos del gimnasio ────────────────────────────────────────── -->
        <div class="col-md-6">
            <div class="card custom-card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-primary bg-opacity-10 p-2 rounded me-3 text-primary">
                            <i class="bi bi-building fs-4"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0">Datos del Gimnasio</h5>
                            <small class="text-muted">Información de tu cuenta</small>
                        </div>
                    </div>

                    <form th:action="@{/perfil/actualizar}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Usuario</label>
                            <input type="text" class="form-control bg-light border-0"
                                   th:value="${usuario.username}" disabled>
                            <div class="form-text small">El nombre de usuario no se puede modificar.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Nombre del Gimnasio</label>
                            <input type="text" name="nombreGimnasio" class="form-control border-0 bg-light"
                                   th:value="${usuario.nombreGimnasio}"
                                   placeholder="Ej: Gimnasio El Campeón">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold">
                                <i class="bi bi-save me-2"></i>Guardar cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ── Cambiar contraseña ────────────────────────────────────────── -->
        <div class="col-md-6">
            <div class="card custom-card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="bg-warning bg-opacity-10 p-2 rounded me-3 text-warning">
                            <i class="bi bi-shield-lock fs-4"></i>
                        </div>
                        <div>
                            <h5 class="fw-bold mb-0">Cambiar Contraseña</h5>
                            <small class="text-muted">Mínimo 8 caracteres</small>
                        </div>
                    </div>

                    <form th:action="@{/perfil/cambiar-password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Contraseña actual</label>
                            <input type="password" name="passwordActual" class="form-control border-0 bg-light"
                                   placeholder="••••••••" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Nueva contraseña</label>
                            <input type="password" name="passwordNueva" id="passwordNueva"
                                   class="form-control border-0 bg-light"
                                   placeholder="••••••••" required minlength="8">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Confirmar nueva contraseña</label>
                            <input type="password" name="confirmar" id="confirmar"
                                   class="form-control border-0 bg-light"
                                   placeholder="••••••••" required minlength="8"
                                   oninput="validarConfirmacion()">
                            <div id="errorConfirmacion" class="text-danger small mt-1 d-none">
                                <i class="bi bi-exclamation-circle me-1"></i>Las contraseñas no coinciden.
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning fw-bold text-white">
                                <i class="bi bi-key me-2"></i>Cambiar contraseña
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script>
        function validarConfirmacion() {
            const nueva    = document.getElementById('passwordNueva').value;
            const confirmar = document.getElementById('confirmar').value;
            const error    = document.getElementById('errorConfirmacion');
            if (confirmar && nueva !== confirmar) {
                error.classList.remove('d-none');
            } else {
                error.classList.add('d-none');
            }
        }
    </script>
</div>
