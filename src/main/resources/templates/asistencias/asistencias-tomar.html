<div th:fragment="contenido">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0">Tomar Asistencia</h4>
            <p class="text-muted small mb-0">Registra la presencia de los alumnos del día</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/asistencias}" class="btn btn-cancelar btn-sm d-flex align-items-center gap-2">
                <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
                <span>Cancelar</span>
            </a>
            <button type="submit" form="formAsistencia" class="btn btn-guardar btn-sm d-flex align-items-center gap-2">
                <i data-lucide="check" style="width:14px;height:14px;"></i>
                <span>Guardar Planilla</span>
            </button>
        </div>
    </div>

    <!-- Filtros -->
    <form class="card custom-card mb-3 p-3 flex-shrink-0 border-0" method="get" th:action="@{/asistencias/tomar}">
        <input type="hidden" name="fecha" th:value="${fechaHoy}">
        <div class="row g-2 align-items-center">
            <div class="col-md-3">
                <div class="input-group input-group-sm">
                    <span class="icons input-group-text bg-light border-end-0 text-muted">
                        <i data-lucide="calendar" style="width:14px;height:14px;"></i>
                    </span>
                    <input type="date" class="form-control form-control-sm border-start-0 ps-0 bg-light"
                           name="fecha" form="formAsistencia"
                           th:value="${fechaHoy}" required>
                </div>
            </div>
            <div class="col-md-3">
                <div class="input-group input-group-sm">
                    <span class="icons input-group-text bg-light border-end-0 text-muted">
                        <i data-lucide="search" style="width:14px;height:14px;"></i>
                    </span>
                    <input id="filtroAsistencias" name="q" type="search" th:value="${q}"
                           class="form-control form-control-sm border-start-0 ps-0 bg-light"
                           placeholder="Buscar por nombre, DNI...">
                </div>
            </div>
            <div class="col-md-3">
                <div class="input-group input-group-sm">
                    <span class="icons input-group-text bg-light border-end-0 text-muted">
                        <i data-lucide="filter" style="width:14px;height:14px;"></i>
                    </span>
                    <select id="filtroActividad" name="idActividad" class="form-select form-select-sm border-start-0 bg-light text-muted">
                        <option value="">Todas las actividades</option>
                        <option th:each="act : ${actividades}"
                                th:value="${act.idActividad}"
                                th:selected="${act.idActividad == idActividadSeleccionada}"
                                th:text="${act.nombre}">
                        </option>
                    </select>
                </div>
            </div>
            <div class="col-md-3 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-sm me-2">Buscar</button>
                <span class="badge bg-light text-dark border rounded-pill px-3 py-2 d-flex align-items-center gap-2">
                    <i data-lucide="user-check" style="width:13px;height:13px;" class="text-success"></i>
                    Marcados: <span id="contadorPresentes" class="fw-bold text-success">0</span>
                </span>
            </div>
        </div>
    </form>

    <!-- Tabla -->
    <form id="formAsistencia" th:action="@{/asistencias/guardar}" method="post">
        <div class="card custom-card border-0 flex-grow-1 overflow-hidden position-relative">
            <div class="table-responsive h-100 w-100 custom-scrollbar">
                <table class="table table-hover align-middle mb-0 tableAnimation" id="tablaAsistencias">
                    <thead class="bg-white" style="position: sticky; top: 0; z-index: 10;">
                        <tr class="text-secondary small text-uppercase">
                            <th class="ps-4 py-3 bg-light border-bottom" style="width:40%;">Alumno</th>
                            <th class="py-3 bg-light border-bottom" style="width:30%;">Actividad</th>
                            <th class="py-3 bg-light border-bottom text-center" style="width:30%;">Asistencia</th>
                        </tr>
                    </thead>
                    <tbody class="border-top-0">
                        <tr th:each="item : ${inscripciones}"
                            class="fila-alumno"
                            th:data-actividad="${item.actividad.nombre}">
                            <td class="ps-4">
                                <div class="fw-bold text-dark"
                                     th:text="${item.cliente.nombre + ' ' + item.cliente.apellido}">Nombre Alumno</div>
                                <small class="text-muted" style="font-size:0.72rem;">
                                    ID: <span th:text="${item.cliente.idCliente}">#</span>
                                </small>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border fw-normal"
                                      th:text="${item.actividad.nombre}">Actividad</span>
                            </td>
                            <td class="text-center">
                                <div class="form-check form-switch d-flex justify-content-center">
                                    <input type="hidden" name="todosLosIds" th:value="${item.idActividadCliente}"/>
                                    <input class="form-check-input input-asistencia"
                                           type="checkbox"
                                           name="presentes"
                                           th:value="${item.idActividadCliente}"
                                           th:checked="${item.tieneAsistenciaEnFecha(fechaHoy)}"
                                           style="width:3em;height:1.5em;cursor:pointer;"
                                           onchange="actualizarContador()">
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(inscripciones)}">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i data-lucide="users" style="width:40px;height:40px;opacity:0.3;" class="d-block mx-auto mb-2"></i>
                                No hay alumnos inscritos en actividades.
                            </td>
                        </tr>

                        <tr id="mensajeVacioJS" style="display:none;">
                            <td colspan="3" class="text-center py-5 text-muted">
                                <i data-lucide="search" style="width:40px;height:40px;opacity:0.3;" class="d-block mx-auto mb-2"></i>
                                No se encontraron alumnos con los filtros actuales.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="border-top px-3 py-2 d-flex justify-content-between align-items-center">
                <span class="small text-muted" th:text="${'Alumnos: ' + pagina.totalElements}"></span>
                <div class="btn-group btn-group-sm" th:if="${pagina.totalPages > 1}">
                    <a class="btn btn-outline-secondary" th:classappend="${pagina.first} ? 'disabled'"
                       th:href="@{/asistencias/tomar(page=${pagina.number - 1},fecha=${fechaHoy},q=${q},idActividad=${idActividadSeleccionada})}">Anterior</a>
                    <span class="btn btn-outline-secondary disabled" th:text="${pagina.number + 1 + ' / ' + pagina.totalPages}"></span>
                    <a class="btn btn-outline-secondary" th:classappend="${pagina.last} ? 'disabled'"
                       th:href="@{/asistencias/tomar(page=${pagina.number + 1},fecha=${fechaHoy},q=${q},idActividad=${idActividadSeleccionada})}">Siguiente</a>
                </div>
            </div>
        </div>
    </form>

    <script th:src="@{/js/asistencias.js}"></script>
</div>
