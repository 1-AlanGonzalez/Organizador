<div th:fragment="contenido" class="h-100 d-flex flex-column ps-2 pe-2 pb-2">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
    <div>
        <h4 class="fw-bold text-dark mb-0">Instructores</h4>
        <p class="text-muted small mb-0">Gestión del personal docente</p>
    </div>
    <div class="d-flex gap-2 align-items-center">
        <div th:if="${success}"
             class="d-flex align-items-center gap-2 px-3 py-2 rounded-3 small fw-medium"
             style="background:#dcfce7;color:#16a34a;">
            <i data-lucide="check-circle" style="width:14px;height:14px;"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}"
             class="d-flex align-items-center gap-2 px-3 py-2 rounded-3 small fw-medium"
             style="background:#fee2e2;color:#ef4444;">
            <i data-lucide="x-circle" style="width:14px;height:14px;"></i>
            <span th:text="${error}"></span>
        </div>
        <button class="btn btn-outline-danger btn-sm btn-modo-eliminar d-flex align-items-center gap-2"
                onclick="toggleModoEliminar()">
            <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
            <span>Eliminar</span>
        </button>
        <a th:href="@{/instructores/nuevo}"
           class="btn-asignar btn btn-primary btn-sm shadow-sm d-flex align-items-center gap-2">
            <i data-lucide="user-plus" style="width:14px;height:14px;"></i>
            <span>Añadir Instructor</span>
        </a>
    </div>
</div>

    <!-- Buscador -->
    <form class="card custom-card mb-3 p-3 flex-shrink-0 border-0" method="get" th:action="@{/instructores}">
        <div class="row">
            <div class="col-md-4">
                <div class="input-group input-group-sm">
                    <span class="icons input-group-text bg-light border-end-0 text-muted">
                        <i data-lucide="search" style="width:14px;height:14px;"></i>
                    </span>
                    <input id="filtroInstructores" name="q" type="search" th:value="${q}"
                           class="form-control border-start-0 ps-0 bg-light"
                           placeholder="Buscar por nombre, DNI...">
                </div>
            </div>
            <div class="col-md-auto"><button class="btn btn-primary btn-sm" type="submit">Buscar</button></div>
        </div>
    </form>

    <!-- Tabla -->
    <div class="card custom-card border-0 flex-grow-1 overflow-hidden position-relative">
        <div class="table-responsive h-100 w-100 custom-scrollbar">
            <table class="table table-hover align-middle mb-0 tableAnimation"
                   id="tablaInstructores" style="width:100%;">
                <thead class="bg-white" style="position:sticky;top:0;z-index:10;">
                    <tr class="text-secondary small text-uppercase">
                        <th class="ps-4 py-3 bg-light border-bottom">Nombre</th>
                        <th class="py-3 bg-light border-bottom">Apellido</th>
                        <th class="py-3 bg-light border-bottom">DNI</th>
                        <th class="py-3 bg-light border-bottom">Teléfono</th>
                        <th class="pe-4 py-3 bg-light border-bottom text-center" style="width:120px;">Acciones</th>
                    </tr>
                </thead>
                <tbody class="border-top-0">
                    <tr th:each="instructor : ${instructores}">
                        <td class="ps-4 fw-bold text-dark" th:text="${instructor.nombre}"></td>
                        <td class="fw-semibold text-dark" th:text="${instructor.apellido}"></td>
                        <td>
                            <span class="badge bg-light text-dark border fw-normal"
                                  th:text="${instructor.dni}"></span>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="bg-light text-secondary rounded-circle d-flex align-items-center justify-content-center border"
                                     style="width:30px;height:30px;">
                                    <i data-lucide="phone" style="width:13px;height:13px;"></i>
                                </div>
                                <span class="small text-muted" th:text="${instructor.telefono}"></span>
                            </div>
                        </td>
                        <td class="pe-4 text-center">
                            <div class="d-flex justify-content-center align-items-center">
                                <div class="btn-accion-wrap">
                                    <a th:href="@{/instructores/editar/{id}(id=${instructor.idInstructor})}"
                                    class="btn btn-sm btn-outline-primary btn-editar-row"
                                    title="Editar">
                                        <i data-lucide="pencil" style="width:13px;height:13px;"></i>
                                    </a>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-danger btn-eliminar"
                                            th:attr="data-id=${instructor.idInstructor},
                                                    data-nombre=${instructor.nombre},
                                                    data-url='/instructores/eliminar'"
                                            onclick="abrirPanelEliminar(this)"
                                            title="Eliminar">
                                        <i data-lucide="trash-2" style="width:13px;height:13px;"></i>
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(instructores)}">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i data-lucide="users" style="width:40px;height:40px;opacity:0.3;"
                               class="d-block mx-auto mb-2"></i>
                            No hay instructores registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="border-top px-3 py-2 d-flex justify-content-between align-items-center">
            <span class="small text-muted" th:text="${'Total: ' + pagina.totalElements}"></span>
            <div class="btn-group btn-group-sm" th:if="${pagina.totalPages > 1}">
                <a class="btn btn-outline-secondary" th:classappend="${pagina.first} ? 'disabled'"
                   th:href="@{/instructores(page=${pagina.number - 1},q=${q})}">Anterior</a>
                <span class="btn btn-outline-secondary disabled" th:text="${pagina.number + 1 + ' / ' + pagina.totalPages}"></span>
                <a class="btn btn-outline-secondary" th:classappend="${pagina.last} ? 'disabled'"
                   th:href="@{/instructores(page=${pagina.number + 1},q=${q})}">Siguiente</a>
            </div>
        </div>
    </div>

    <!-- Panel eliminar — solo confirmación, se mantiene como overlay -->
    <div id="panelEliminarOverlay" class="panel-overlay d-none" onclick="cerrarPanelEliminar()">
        <div class="panel-container" onclick="event.stopPropagation()"
             th:insert="~{fragments/common/panel-eliminar :: panelEliminar}"></div>
    </div>

    <script th:src="@{/js/instructores.js}"></script>
</div>
