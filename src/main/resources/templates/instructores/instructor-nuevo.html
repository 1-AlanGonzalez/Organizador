<div th:fragment="contenido" class="h-100 d-flex flex-column ps-2 pe-2 pb-2">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0"
                th:text="${instructor.idInstructor != null} ? 'Editar Instructor' : 'Nuevo Instructor'">
                Nuevo Instructor
            </h4>
            <p class="text-muted small mb-0">Gestión del personal y datos de contacto</p>
        </div>
        <a th:href="@{/instructores}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2">
            <i data-lucide="arrow-left" style="width:14px;height:14px;"></i>
            <span>Volver</span>
        </a>
    </div>

    <!-- Alertas flash -->
    <div th:if="${success}" class="alert alert-success border-0 rounded-3 shadow-sm d-flex align-items-center gap-2 mb-3">
        <i data-lucide="check-circle" style="width:16px;height:16px;"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger border-0 rounded-3 shadow-sm d-flex align-items-center gap-2 mb-3">
        <i data-lucide="alert-triangle" style="width:16px;height:16px;"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card custom-card border-0"
                 style="background: var(--card-bg); box-shadow: var(--card-shadow);">
                <div class="card-body p-0">

                    <form th:action="@{/instructores/guardar}" th:object="${instructor}" method="post">
                        <input type="hidden" th:field="*{idInstructor}">

                        <!-- BLOQUE 1: Datos personales -->
                        <div class="p-4 pb-3">
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <i data-lucide="badge" style="width:15px;height:15px;" class="text-secondary"></i>
                                <span class="fw-bold text-dark small text-uppercase"
                                      style="letter-spacing:0.05em;">Datos del Instructor</span>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Nombre</label>
                                    <input type="text" th:field="*{nombre}"
                                           class="form-control" placeholder="Ingrese el nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Apellido</label>
                                    <input type="text" th:field="*{apellido}"
                                           class="form-control" placeholder="Ingrese el apellido" required>
                                </div>
                            </div>
                        </div>

                        <hr class="m-0" style="border-color:#f1f5f9;">

                        <!-- BLOQUE 2: Contacto -->
                        <div class="p-4 pb-3">
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <i data-lucide="phone" style="width:15px;height:15px;" class="text-secondary"></i>
                                <span class="fw-bold text-dark small text-uppercase"
                                      style="letter-spacing:0.05em;">Contacto e Identificación</span>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">DNI</label>
                                    <div class="input-group">
                                        <span class="icons input-group-text bg-light text-muted">
                                            <i data-lucide="credit-card" style="width:14px;height:14px;"></i>
                                        </span>
                                        <input type="text" th:field="*{dni}"
                                               class="form-control" placeholder="Ej: 40123456" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-bold text-secondary">Teléfono</label>
                                    <div class="input-group">
                                        <span class="icons input-group-text bg-light text-muted">
                                            <i data-lucide="phone" style="width:14px;height:14px;"></i>
                                        </span>
                                        <input type="text" th:field="*{telefono}"
                                               class="form-control" placeholder="Ej: 11 1234 5678" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr class="m-0" style="border-color:#f1f5f9;">

                        <!-- Acciones -->
                        <div class="p-4 pt-3 d-flex flex-column gap-2">
                            <button type="submit"
                                    class="btn btn-guardar py-2 d-flex align-items-center justify-content-center gap-2">
                                <i data-lucide="save" style="width:16px;height:16px;"></i>
                                <span th:text="${instructor.idInstructor != null} ? 'Guardar Cambios' : 'Registrar Instructor'">
                                    Registrar Instructor
                                </span>
                            </button>
                            <a th:href="@{/instructores}"
                               class="btn btn-cancelar btn-sm text-center">
                                Cancelar
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

</div>
