<div th:fragment="contenido">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0">Registrar Pago</h4>
            <p class="text-muted small mb-0">Ingrese los detalles del nuevo ingreso</p>
        </div>
        <a th:href="@{/ingresos}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i>
            <span>Volver</span>
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">

            <div class="card custom-card border-0">
                <div class="card-body p-0">

                    <form th:action="@{/ingresos/guardar}" method="post">

                        <!-- ══ BLOQUE 1: Cliente ══ -->
                        <div class="p-4 pb-3">

                            <div class="d-flex align-items-center gap-2 mb-3">
                                <div class="icon-box-light icon-bg-blue rounded-3 flex-shrink-0"
                                     style="width: 32px; height: 32px; font-size: 0.85rem;">
                                    <i class="bi bi-person"></i>
                                </div>
                                <span class="fw-bold text-dark small">Cliente</span>
                            </div>

                            <!-- Sin onchange: Tom Select lo maneja desde pagos.js -->
                            <select class="form-select" id="clienteSelect" required>
                                <option value="" disabled selected>Buscar cliente...</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.idCliente}"
                                        th:text="${c.nombre + ' ' + c.apellido}">
                                </option>
                            </select>
                            <div class="form-text small text-muted mt-1">
                                Seleccione la inscripción que desea cobrar.
                            </div>
                            <div id="deudasContainer" class="mt-3"></div>
                        </div>

                        <hr class="m-0" style="border-color: #f1f5f9;">

                        <!-- ══ BLOQUE 2: Detalle ══ -->
                        <div class="p-4 pb-3">

                            <div class="d-flex align-items-center gap-2 mb-3">
                                <div class="icon-box-light icon-bg-green rounded-3 flex-shrink-0"
                                     style="width: 32px; height: 32px; font-size: 0.85rem;">
                                    <i class="bi bi-cash-coin"></i>
                                </div>
                                <span class="fw-bold text-dark small">Detalle del pago</span>
                            </div>

                            <div class="row g-3">

                                <!-- Monto -->
                                <div class="col-md-6">
                                    <label for="monto" class="form-label small text-muted fw-bold text-uppercase mb-1"
                                           style="font-size: 0.65rem; letter-spacing: 0.06em;">Monto</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 fw-bold text-success">$</span>
                                        <input type="number"
                                               step="0.01"
                                               class="form-control fw-bold text-dark border-start-0"
                                               id="monto"
                                               name="monto"
                                               placeholder="0.00"
                                               required>
                                    </div>
                                </div>

                                <!-- Método -->
                                <div class="col-md-6">
                                    <label for="metodo" class="form-label small text-muted fw-bold text-uppercase mb-1"
                                           style="font-size: 0.65rem; letter-spacing: 0.06em;">Método de pago</label>
                                    <select class="form-select" id="metodo" name="metodoPagoId" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option th:each="m : ${metodosPago}"
                                            th:value="${m.idMetodo}"
                                            th:text="${m.nombre}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Fecha -->
                                <div class="col-12">
                                    <label for="fecha" class="form-label small text-muted fw-bold text-uppercase mb-1"
                                           style="font-size: 0.65rem; letter-spacing: 0.06em;">Fecha de pago</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-calendar-event"></i>
                                        </span>
                                        <input type="date"
                                               class="form-control border-start-0"
                                               id="fecha"
                                               name="fecha"
                                               th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                               required>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <hr class="m-0" style="border-color: #f1f5f9;">

                        <!-- ══ ACCIONES ══ -->
                        <div class="p-4 pt-3 d-flex flex-column gap-2">
                            <button type="submit"
                                    class="btn btn-success py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-check-lg"></i>
                                Confirmar Pago
                            </button>
                            <a th:href="@{/ingresos}"
                               class="btn btn-link text-decoration-none text-muted btn-sm text-center">
                                Cancelar operación
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script th:src="@{/js/pagos.js}"></script>
</div>
