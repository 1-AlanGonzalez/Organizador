<div th:fragment="contenido">

    <div class="d-flex align-items-center justify-content-between mb-3 pt-3 flex-shrink-0">
        <div>
            <h4 class="fw-bold text-dark mb-0">Registrar Pago</h4>
            <p class="text-muted small mb-0">Ingrese los detalles del nuevo ingreso</p>
        </div>
        <a th:href="@{/ingresos}" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2">
            <i class="bi bi-arrow-left"></i>
            <span>Volver</span>
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card custom-card border-0">
                <div class="card-body p-4">

                    <form th:action="@{/ingresos/guardar}" method="post">

                        <!-- Cliente / Inscripción -->
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase text-secondary" style="letter-spacing: 0.05em;">
                                Inscripción / Cliente
                            </label>
                            <select class="form-select" id="clienteSelect" required onchange="cargarDeudas()">
                                <option value="" disabled selected>Seleccione cliente...</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.idCliente}"
                                        th:text="${c.nombre + ' ' + c.apellido}">
                                </option>
                            </select>
                            <div class="form-text small text-muted mt-1">
                                Seleccione la inscripción que desea cobrar.
                            </div>
                            <div id="deudasContainer" class="mt-3"></div>
                        </div>

                        <hr class="my-3" style="border-color: #f1f5f9;">

                        <!-- Monto y Método -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="monto" class="form-label small fw-bold text-uppercase text-secondary" style="letter-spacing: 0.05em;">Monto</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-light border-end-0 fw-bold text-success">$</span>
                                    <input type="number"
                                           step="0.01"
                                           class="form-control fw-bold text-dark border-start-0"
                                           id="monto"
                                           name="monto"
                                           placeholder="0.00"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="metodo" class="form-label small fw-bold text-uppercase text-secondary" style="letter-spacing: 0.05em;">Método de Pago</label>
                                <select class="form-select form-select-sm" id="metodo" name="metodoPagoId" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option th:each="m : ${metodosPago}"
                                            th:value="${m.idMetodoDePago}"
                                            th:text="${m.nombre}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Fecha -->
                        <div class="mb-4">
                            <label for="fecha" class="form-label small fw-bold text-uppercase text-secondary" style="letter-spacing: 0.05em;">Fecha de Pago</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-calendar-event"></i></span>
                                <input type="date"
                                       class="form-control border-start-0"
                                       id="fecha"
                                       name="fecha"
                                       th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                                       required>
                            </div>
                        </div>

                        <hr class="my-3" style="border-color: #f1f5f9;">

                        <!-- Acciones -->
                        <div class="d-flex flex-column gap-2">
                            <button type="submit" class="btn btn-success btn-sm py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-check-lg"></i> Confirmar Pago
                            </button>
                            <a th:href="@{/ingresos}" class="btn btn-link text-decoration-none text-muted btn-sm text-center">
                                Cancelar operación
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script th:src="@{/js/pagos.js}"></script>
</div>
