spring.datasource.url=jdbc:mariadb://localhost:3300/GymOrganization
spring.datasource.username=root
spring.datasource.password=1234

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Sesión expira a los 30 minutos de inactividad
server.servlet.session.timeout=30m

# ──────────────────────────────────────────────────────────────────────────
# application-prod.properties — perfil de PRODUCCIÓN
# Para activarlo: java -jar gym-manager.jar --spring.profiles.active=prod
# ──────────────────────────────────────────────────────────────────────────

# NO actualiza ni modifica la estructura de la base en producción.
# Si hay un desajuste entre entidades y tablas, la app NO arranca y avisa.
# Esto evita que Hibernate haga cambios silenciosos en producción.
spring.jpa.hibernate.ddl-auto=validate

# Sin SQL en los logs — en producción no queremos llenar los logs con queries
spring.jpa.show-sql=false

# Solo errores y warnings importantes
logging.level.root=WARN
logging.level.com.gymmanager=INFO

# La contraseña del admin viene de variable de entorno, no del archivo
# En el servidor: export APP_ADMIN_PASSWORD=ContraseñaSegura
# NO poner la contraseña real acá