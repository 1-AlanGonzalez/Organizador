# Perfil de produccion.
# Activar con: --spring.profiles.active=prod

# Conexion obligatoria: no hay valores locales por defecto en produccion.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate valida el esquema, pero nunca lo modifica silenciosamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Evita consultas tardias desde las vistas.
spring.jpa.open-in-view=false

# Sesiones y cookies para un sitio servido exclusivamente mediante HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# Recursos empaquetados dentro del JAR y cacheados en produccion.
spring.thymeleaf.cache=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=365d
spring.web.resources.chain.cache=true

# No exponer detalles internos en las respuestas de error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=WARN
logging.level.com.gymmanager=INFO

# Secretos y limites proporcionados por el entorno del servidor.
app.admin.password=${APP_ADMIN_PASSWORD}
app.security.maximum-sessions=${APP_MAXIMUM_SESSIONS:1}
